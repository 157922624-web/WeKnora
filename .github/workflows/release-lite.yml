name: Release Lite Binaries

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

concurrency:
  group: release-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 1. Build frontend once, share as artifact (for Web CLI) ──
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 2a. Build Web CLI binary per platform (native CGO) ──
  build-binary:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-14
            goos: darwin
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} for ${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Build
        run: |
          export EDITION=lite
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="-w -s $(./scripts/get_version.sh ldflags)"
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"
          fi
          go build -tags "sqlite_fts5" -ldflags="${LDFLAGS}" \
            -o WeKnora-lite ./cmd/server

      - name: Package tarball
        run: |
          ARCHIVE="WeKnora-lite_${{ steps.ver.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "${ARCHIVE}/web"
          cp WeKnora-lite "${ARCHIVE}/"
          bash ./scripts/copy-licenses.sh "${ARCHIVE}"
          cp -r web/* "${ARCHIVE}/web/"
          cp .env.lite.example "${ARCHIVE}/"
          cp docs/LITE.md "${ARCHIVE}/README.md"
          if [ -d config ]; then
            cp -r config "${ARCHIVE}/config"
          fi
          if [ -d migrations/sqlite ]; then
            mkdir -p "${ARCHIVE}/migrations/sqlite"
            cp -r migrations/sqlite/* "${ARCHIVE}/migrations/sqlite/"
          fi
          if [ -f deploy/weknora-lite.service ]; then
            cp deploy/weknora-lite.service "${ARCHIVE}/"
          fi
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            WeKnora-lite_*.tar.gz
            WeKnora-lite_*.tar.gz.sha256
          retention-days: 3

  # ── 2b. Build Desktop APP per platform (Wails) ──
  build-desktop-app:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/universal
            arch_label: macOS_universal
            artifact_name: desktop-macos-universal
          - os: macos-14
            platform: darwin/amd64
            arch_label: macOS_amd64
            artifact_name: desktop-macos-amd64
          - os: macos-14
            platform: darwin/arm64
            arch_label: macOS_arm64
            artifact_name: desktop-macos-arm64
          - os: ubuntu-latest
            platform: linux/amd64
            arch_label: linux_amd64
            artifact_name: desktop-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            arch_label: windows_amd64
            artifact_name: desktop-windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v6

      # Wails embeds frontend/dist into the desktop binary at build time.
      # Without this artifact the AssetServer has no SPA to serve and the
      # WebView renders a blank white page (v0.8.3 regression).
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Verify frontend dist embedded source
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          grep -q 'id="app"' frontend/dist/index.html
          ls frontend/dist | head
          # Wails embeds {frontend:dir}/dist via //go:embed, which cannot
          # reference paths outside the Go package (no '..'). cmd/desktop
          # has frontend:dir "../../frontend" for local dev, so copy the
          # built dist into the package-local path Wails will actually
          # embed. Without this, wails build silently embeds nothing and
          # the WebView shows the "index.html not found" error page.
          mkdir -p cmd/desktop/frontend
          rm -rf cmd/desktop/frontend/dist
          cp -r frontend/dist cmd/desktop/frontend/dist
          test -f cmd/desktop/frontend/dist/index.html

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # choco installs to a fixed dir but the runner process already
          # holds its environment, so machine-PATH changes are invisible to
          # later steps. GITHUB_PATH makes makensis resolvable when
          # `wails build -nsis` shells out to it (run 37764535335 failed
          # with "makensis not found").
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pre-compile Go packages (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          # sqlite-vec cgo needs a sqlite3.h header; Windows runners don't
          # provide one. Reuse the amalgamation header shipped inside the
          # mattn/go-sqlite3 module so the header matches the SQLite that is
          # actually linked into the binary.
          go mod download github.com/mattn/go-sqlite3
          MODCACHE="$(go env GOMODCACHE | tr '\\' '/')"
          SQLITE_SRC="$(ls -d "${MODCACHE}"/github.com/mattn/go-sqlite3@*/ | head -n 1)"
          mkdir -p .sqlite3hdr
          cp "${SQLITE_SRC}sqlite3-binding.h" .sqlite3hdr/sqlite3.h
          cp "${SQLITE_SRC}sqlite3ext.h" .sqlite3hdr/sqlite3ext.h
          export CGO_CFLAGS="${CGO_CFLAGS} -I$(pwd -W | tr '\\' '/')/.sqlite3hdr"
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      # ── Windows: stage runtime resources the NSIS installer must ship ──
      # The desktop binary expects config/, migrations/sqlite, .env and the
      # gojieba dictionaries relative to its working directory (cmd/desktop
      # main.go chdirs to the exe dir). macOS/Linux packaging already copies
      # these; the Windows installer previously shipped only the bare exe
      # and every fresh install panicked at boot (missing config/.env/dict).
      - name: Stage Windows runtime resources (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -d config
          test -d migrations/sqlite
          # .env: cmd/desktop/main.go calls godotenv.Load() so DB_DRIVER etc.
          # get set (same file the macOS bundle ships).
          test -f .env.lite.example
          cp .env.lite.example .env
          grep -q '^DB_DRIVER=sqlite' .env
          # gojieba dictionaries from the module cache (no network beyond go).
          go mod download github.com/yanyiwu/gojieba
          MODCACHE="$(go env GOMODCACHE | tr '\\' '/')"
          JIEBA_SRC="$(ls -d "${MODCACHE}"/github.com/yanyiwu/gojieba@*/deps/cppjieba/dict/ | head -n 1)"
          test -n "${JIEBA_SRC}"
          test -d "${JIEBA_SRC}"
          mkdir -p jieba-dict
          for f in jieba.dict.utf8 hmm_model.utf8 user.dict.utf8 idf.utf8 stop_words.utf8; do
            cp "${JIEBA_SRC}${f}" "jieba-dict/${f}"
          done
          ls -la jieba-dict
          test -f jieba-dict/jieba.dict.utf8

      - name: Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations"

          BUILD_TAGS="sqlite_fts5"
          NSIS_FLAG=""
          BINDINGS_FLAG=""

          if [ "${{ runner.os }}" = "Linux" ]; then
            BUILD_TAGS="sqlite_fts5 webkit2_41"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            NSIS_FLAG="-nsis"
            # Bindings generation runs a helper binary that imports
            # internal/types, whose package init calls gojieba (C++) and
            # reliably segfaults on the Windows runner (run 37758244585).
            # The generated JS/TS bindings are committed in
            # frontend/src/wailsjs, so skip regeneration on Windows only.
            BINDINGS_FLAG="-skipbindings"
            # sqlite-vec cgo needs sqlite3.h. The Pre-compile step (same
            # workspace) already staged the amalgamation headers into
            # .sqlite3hdr; only the CGO_CFLAGS export must be repeated here
            # because every step is a fresh shell. Do NOT re-copy the files:
            # they inherit the Go module cache's read-only mode, and
            # overwriting them fails on Windows with "Permission denied".
            if [ ! -f .sqlite3hdr/sqlite3.h ]; then
              go mod download github.com/mattn/go-sqlite3
              MODCACHE="$(go env GOMODCACHE | tr '\\' '/')"
              SQLITE_SRC="$(ls -d "${MODCACHE}"/github.com/mattn/go-sqlite3@*/ | head -n 1)"
              mkdir -p .sqlite3hdr
              cp "${SQLITE_SRC}sqlite3-binding.h" .sqlite3hdr/sqlite3.h
              cp "${SQLITE_SRC}sqlite3ext.h" .sqlite3hdr/sqlite3ext.h
            fi
            export CGO_CFLAGS="${CGO_CFLAGS} -I$(pwd -W | tr '\\' '/')/.sqlite3hdr"
          fi

          bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          # //go:embed cannot reference paths outside the Go package ('..').
          # The committed wails.json has frontend:dir "../../frontend" for
          # local dev (frontend lives at repo root). At build time we must
          # point it at the package-local copy staged by the verify step,
          # otherwise wails build embeds nothing and the WebView shows
          # the "index.html not found" error page at runtime.
          test -f frontend/dist/index.html
          # Portable across macOS/Linux/Windows Git Bash (no python3 on PATH).
          sed -i.bak 's|"frontend:dir": "../../frontend"|"frontend:dir": "frontend"|' wails.json
          rm -f wails.json.bak
          grep -q '"frontend:dir": "frontend"' wails.json
          echo "Patched wails.json frontend:dir -> frontend"
          # `wails build -nsis` on Windows can exit 1 even when the build
          # and NSIS installer both succeed (run 37896862479: L821 "Built",
          # L825 "Building 'amd64' installer: Done", then exit 1). The bash
          # shell runs with -e, so this false non-zero would abort before
          # the post-build gate below. Tolerate it; the gate is the real
          # check that the frontend landed in the binary.
          wails build -clean \
            ${BINDINGS_FLAG} \
            -tags "${BUILD_TAGS}" \
            -platform "${{ matrix.platform }}" \
            ${NSIS_FLAG} \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite" \
            || WAILS_EXIT=$?
          if [ -n "${WAILS_EXIT:-}" ] && [ "${WAILS_EXIT}" -ne 0 ]; then
            echo "wails build exited ${WAILS_EXIT} (known false-negative on Windows NSIS); continuing to post-build gate."
          fi
          # Post-build gate: confirm the SPA actually landed in the binary.
          # id="app" appears in both the Vite index.html and Wails' own
          # fallback page, so require a Vite hashed-asset path marker too.
          # vite.config.ts uses rollupOptions.input { main, embed }, so the
          # entry chunks are assets/main-*.js — NOT the single-page default
          # assets/index-*.js (that was the false-negative that failed run
          # 37893748968 after a successful wails build).
          BIN=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="build/bin/WeKnora Lite.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            BIN="build/bin/WeKnora Lite.app/Contents/MacOS/WeKnora Lite"
          else
            BIN="build/bin/WeKnora Lite"
          fi
          test -f "$BIN"
          if ! grep -a -q 'assets/main-' "$BIN"; then
            echo "::error::Frontend assets not embedded in $BIN (no 'assets/main-' marker). wails.json frontend:dir or the dist staging step is broken."
            exit 1
          fi
          echo "OK: $BIN contains embedded Vite assets."

      # ── macOS: bundle .app with resources, then create DMG ──
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          APP_BUNDLE="WeKnora Lite.app"
          SRC="cmd/desktop/build/bin/${APP_BUNDLE}"
          RESOURCES="${SRC}/Contents/Resources"

          mkdir -p "${RESOURCES}/config"
          mkdir -p "${RESOURCES}/migrations/sqlite"
          bash ./scripts/copy-licenses.sh "${RESOURCES}"

          if [ -f .env.lite.example ]; then
            cp .env.lite.example "${RESOURCES}/.env"
          fi
          if [ -d migrations/sqlite ]; then
            cp -r migrations/sqlite/* "${RESOURCES}/migrations/sqlite/"
          fi
          if [ -d config ]; then
            cp -r config/* "${RESOURCES}/config/"
          fi

          DMG_NAME="WeKnora-Lite-App_${{ steps.ver.outputs.version }}_${{ matrix.arch_label }}"

          DMG_SRC="dmg_staging"
          mkdir -p "${DMG_SRC}"
          cp -R "cmd/desktop/build/bin/${APP_BUNDLE}" "${DMG_SRC}/"
          ln -s /Applications "${DMG_SRC}/Applications"

          hdiutil create -volname "WeKnora Lite" \
            -srcfolder "${DMG_SRC}" \
            -ov -format UDZO \
            "${DMG_NAME}.dmg"

          shasum -a 256 "${DMG_NAME}.dmg" > "${DMG_NAME}.dmg.sha256"

      # ── Linux: package tarball ──
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          ARCHIVE="WeKnora-Lite-App_${{ steps.ver.outputs.version }}_${{ matrix.arch_label }}"
          mkdir -p "${ARCHIVE}"
          cp "cmd/desktop/build/bin/WeKnora Lite" "${ARCHIVE}/"
          bash ./scripts/copy-licenses.sh "${ARCHIVE}"
          if [ -f .env.lite.example ]; then
            cp .env.lite.example "${ARCHIVE}/"
          fi
          cp docs/LITE.md "${ARCHIVE}/README.md"
          if [ -d config ]; then
            cp -r config "${ARCHIVE}/config"
          fi
          if [ -d migrations/sqlite ]; then
            mkdir -p "${ARCHIVE}/migrations/sqlite"
            cp -r migrations/sqlite/* "${ARCHIVE}/migrations/sqlite/"
          fi
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      # ── Windows: NSIS installer includes licenses and corresponding source ──
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE="WeKnora-Lite-App_${{ steps.ver.outputs.version }}_${{ matrix.arch_label }}"
          INSTALLER="cmd/desktop/build/bin/WeKnora Lite-amd64-installer.exe"
          # Do not publish a bare executable if NSIS was unavailable: the
          # installer also carries the notices/source and supports auto-update.
          test -f "$INSTALLER"
          cp "$INSTALLER" "${ARCHIVE}_setup.exe"
          sha256sum "${ARCHIVE}_setup.exe" > "${ARCHIVE}_setup.exe.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            WeKnora-Lite-App_*
          retention-days: 3

  # ── 3. Create GitHub Release ──
  release:
    needs: [build-binary, build-desktop-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          cat > notes.md << 'NOTES'
          ## WeKnora Lite ${{ steps.ver.outputs.version }}

          ### Web CLI 版（命令行 / 服务器部署）

          单二进制部署，零外部依赖（无需 Docker / PostgreSQL / Redis）。

          ```bash
          # 1. 解压
          tar xzf WeKnora-lite_${{ steps.ver.outputs.version }}_<os>_<arch>.tar.gz
          cd WeKnora-lite_${{ steps.ver.outputs.version }}_<os>_<arch>

          # 2. 配置
          cp .env.lite.example .env.lite
          # 编辑 .env.lite，至少确认 OLLAMA_BASE_URL 正确

          # 3. 启动 Ollama（如尚未运行）
          ollama serve &
          ollama pull qwen2.5:7b
          ollama pull nomic-embed-text

          # 4. 运行
          set -a && source .env.lite && set +a
          ./WeKnora-lite
          # 访问 http://localhost:8080
          ```

          | 文件 | 平台 |
          |------|------|
          | `WeKnora-lite_*_linux_amd64.tar.gz` | Linux x86_64 |
          | `WeKnora-lite_*_linux_arm64.tar.gz` | Linux ARM64 |
          | `WeKnora-lite_*_darwin_amd64.tar.gz` | macOS Intel |
          | `WeKnora-lite_*_darwin_arm64.tar.gz` | macOS Apple Silicon |

          ---

          ### 桌面 APP 版（开箱即用，无需命令行）

          原生桌面应用，内置 Web 服务，双击即可运行。

          | 文件 | 平台 |
          |------|------|
          | `WeKnora-Lite-App_*_macOS_universal.dmg` | macOS (Intel + Apple Silicon) |
          | `WeKnora-Lite-App_*_macOS_amd64.dmg` | macOS Intel |
          | `WeKnora-Lite-App_*_macOS_arm64.dmg` | macOS Apple Silicon |
          | `WeKnora-Lite-App_*_linux_amd64.tar.gz` | Linux x86_64 |
          | `WeKnora-Lite-App_*_windows_amd64_setup.exe` | Windows x86_64 (安装包) |

          详细文档见 [LITE.md](docs/LITE.md)。
          NOTES

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --title "WeKnora Lite ${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            WeKnora-lite_*.tar.gz \
            WeKnora-lite_*.tar.gz.sha256 \
            WeKnora-Lite-App_* || true

  # ── 4. Update Homebrew Formula ──
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets to be available
        run: sleep 15

      - name: Update Formula
        run: ./scripts/update-homebrew-formula.sh "${{ steps.ver.outputs.version }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/weknora-lite.rb
          if git diff --cached --quiet; then
            echo "No changes to Formula"
          else
            git commit -m "formula: update weknora-lite to ${{ steps.ver.outputs.version }}"
            git push origin main
          fi
